; Copy to bwoc.ini and edit. Every key is optional; the values shown are the defaults unless marked.

[paths]
; Built from gpucheck/gpucheck.cu (see README).
; gpucheck = gpucheck/gpucheck.exe
; For queries only. Under WSL the default is /usr/lib/wsl/lib/nvidia-smi.
; nvidia_smi = nvidia-smi
; powershell = powershell.exe
; afterburner_exe = C:\Program Files (x86)\MSI Afterburner\MSIAfterburner.exe
; afterburner_profiles = C:\Program Files (x86)\MSI Afterburner\Profiles
; Needed only if the Profiles folder holds more than one NVIDIA card file.
; afterburner_profile_file =
; state_dir = state

[elevated]
; direct: this Python process runs as administrator on Windows and does everything itself.
; helper: tools/helper.ps1 runs elevated and takes commands through helper_dir (works from WSL too).
mode = helper
; The folder holding helper.ps1, as THIS process sees it (from WSL: /mnt/c/...). Example, not a default:
helper_dir = C:\bwoc\tools
; Scheduled task to start if the helper does not answer (see tools/install-tasks.ps1).
helper_task = BWOC helper
; timeout = 60

[afterburner]
; Curve read from here (the factory base clocks). Save a curve to this slot in Afterburner first.
source_profile = 1
; The only slot this tool writes. Must differ from source_profile.
work_profile = 5
; Applied after every failure, and at the end if final_profile is empty (then source_profile is used).
; Pick a slot you know is stable. Example, not a default:
safe_profile = 3
; final_profile =
; Written into the work profile with every test curve.
power_limit = 100
voltage_boost = 100
mem_offset_mhz = 0

[cap]
; Clock range set after failures and at the end. Empty max_mhz = no cap (nvidia-smi -rgc instead).
min_mhz = 210
; Example, not a default:
max_mhz = 3180

[sweep]
seconds = 60
; Offset of the first step when --start gives none for a voltage.
start_offset = 270
step = 30
fine_step = 15
; Offsets above this use fine_step (each failure costs a bugcheck, so go slower near the edge).
fine_above = 420
; Driver limit per curve point.
max_offset = 1000
; The reported clock sits 15 to 23 MHz under any lock.
lock_tolerance = 30
; Light mode: a step whose median voltage is this far under the target is "not reached".
voltage_tolerance = 20
; Seconds to wait with --resume after a boot.
boot_delay = 150

[3dmark]
; Direct test launches (python -m bwoc tse). See docs/VALIDATION.md for how to get the workload files.
; The test binary, as Windows sees it. Example for Time Spy, not a default:
exe = C:\Program Files\3DMark\dlc\time-spy-test\bin\x64\3DMarkTimeSpy.exe
; Working directory for the binary. Empty = the folder of exe.
; workdir =
; Folder holding the workload files (gt1.json, gt2.json, ...), as THIS process sees it. Must be visible to
; Windows (from WSL: a /mnt/c/... path). Results are written next to them. Example, not a default:
workload_dir = /mnt/c/bwoc/3dmark
; Text in the adapter name used to find the GPU's DXGI LUID (it changes every boot).
adapter_match = RTX 5090
; Seconds before a run that has not ended counts as hung.
; timeout = 150
; Seconds between checks for a driver reset (event 4101 or nvlddmkm) or the end of the run.
; poll = 2
; Display mode written into every workload. true = borderless fullscreen ("is_borderless": true with
; "is_windowed": false), which held on every run. false = exclusive fullscreen, which on a multi-monitor desktop
; went fullscreen only on the first run after a boot and then fell back to a 3840x2160 window (see docs/VALIDATION.md).
; borderless = true
; swapchain_resolution written into every workload: the native size of the display the test should fill.
; Empty = the primary display's native size (tools/screen.ps1). Example, not a default:
; swapchain = 1920x1080
; Seconds after the launch to read the test window (tools/winrect.ps1) and record the mode it really ran in.
; 0 = never.
; window_check = 30

[trial]
; Runs per trial. One hang ends a gate trial (--gate); --rate does every run and reports the hang rate.
; runs = 8
; Workload names in workload_dir, comma separated, run in this order every run.
; tests = gt2
; A launch with no result and no driver reset did not run (locked drive, stale LUID, sleeping display).
; It is relaunched this many times before it counts as a failure.
; relaunch = 3
; Seconds to wait after a failure before setup runs again.
; cooldown = 10
